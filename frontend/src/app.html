<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgriMatch - Agricultural Produce Market System</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Custom CSS -->
  <style>
    :root {
      --primary: #2d6a4f;
      --primary-light: #40916c;
      --primary-dark: #1b4332;
      --secondary: #d4a373;
      --secondary-light: #e9c46a;
      --accent: #e76f51;
      --bg: #f0f4f0;
      --bg-card: #ffffff;
      --text: #212529;
      --text-light: #6c757d;
      --text-white: #ffffff;
      --border: #dee2e6;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.3s ease;
      --score-excellent: #2d6a4f;
      --score-good: #52b788;
      --score-fair: #e9c46a;
      --score-poor: #e76f51;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Header Styles */
    .header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
      color: var(--text-white);
      padding: 1.5rem 2rem;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      font-size: 2.2rem;
    }

    .logo h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
    }

    .logo p {
      font-size: 0.8rem;
      opacity: 0.85;
      margin-top: -2px;
    }

    .header-stats {
      display: flex;
      gap: 1.5rem;
    }

    .header-stat {
      text-align: center;
      background: rgba(255,255,255,0.15);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      backdrop-filter: blur(10px);
    }

    .header-stat .number {
      font-size: 1.4rem;
      font-weight: 700;
      display: block;
    }

    .header-stat .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.85;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .nav-tab {
      padding: 0.75rem 2rem;
      border: 2px solid var(--border);
      background: transparent;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-light);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-tab:hover {
      border-color: var(--primary-light);
      color: var(--primary);
      background: rgba(45, 106, 79, 0.05);
    }

    .nav-tab.active {
      background: var(--primary);
      color: var(--text-white);
      border-color: var(--primary);
      box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3);
    }

    .tab-icon {
      font-size: 1.2rem;
    }

    /* Main Content */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards and Panels */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--bg);
    }

    .card-header h2 {
      font-size: 1.3rem;
      color: var(--primary-dark);
      margin: 0;
    }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .form-group label .req {
      color: var(--accent);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 0.7rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      transition: var(--transition);
      background: var(--bg);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
      background: white;
    }

    /* Buttons */
    .btn {
      padding: 0.75rem 1.75rem;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: var(--text-white);
      box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(45, 106, 79, 0.4);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--text-white);
    }

    .btn-secondary:hover {
      background: var(--secondary-light);
      color: var(--text);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary);
      color: var(--text-white);
    }

    .btn-danger {
      background: var(--accent);
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-sm {
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .nav-tab {
        padding: 0.6rem 1.2rem;
        font-size: 0.85rem;
      }
    }

    /* Utility Classes */
    .text-center { text-align: center; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }

    /* Loading Animation */
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .loading {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <slot />
  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>
  <!-- Leaflet Map Container (hidden initially) -->
  <div id="map" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: white;"></div>
</body>
</html>
